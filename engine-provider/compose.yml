# Engine-Provider für die RookHub-Analyse (läuft auf DEINEM Rechner, nicht auf dem Server).
#
#   cp .env.example .env   # ROOKHUB_URL + Token eintragen (direkt mit RookHub)
#   docker compose up -d --build
#
# Zusätzlich über Lichess (Cloud-Anbieter, das Analysebrett von lichess.org): ZWEITER Container,
# eigene .env.lichess, Profil `lichess` — siehe engine-provider-lichess unten.
#
# Bewusst KEIN `ports:`-Eintrag: der Provider verbindet sich ausgehend zum Broker (RookHub bzw.
# Lichess) und wartet dort auf Arbeit. Es muss also nichts freigegeben oder weitergeleitet werden.
services:
  engine-provider:
    build: .
    image: rookhub-engine-provider
    container_name: rookhub-engine-provider
    env_file: .env
    restart: unless-stopped
    # Ohne init läuft Python als PID 1 — und PID 1 ignoriert SIGTERM mangels Handler: jedes
    # `docker compose down/restart` hing 10 s im Timeout, bis Docker hart abschoss. init setzt
    # ein winziges PID-1-Programm davor, das das Signal weiterreicht und nebenbei den
    # Engine-Unterprozess (Stockfish) einsammelt.
    init: true
    # Eigene Engine-Binärdatei statt des mitgelieferten Stockfish? Einhängen und in der
    # .env ENGINE_PATH=/engine/<datei> setzen:
    # volumes:
    #   - /pfad/zu/deiner/engine:/engine:ro
    #
    # Rechenlast deckeln, damit die Analyse den Rechner nicht lahmlegt (MAX_THREADS in der
    # .env sollte dazu passen — der Provider selbst kennt dieses Limit nicht):
    # cpus: 4
    #
    # Mehrere Engines aus diesem einen Container: in der .env eine HAUPT-Engine und n
    # HINTERGRUND-Engines beschreiben (ENGINE_PRIMARY_NAME/ENGINE_PRIMARY_MAX_THREADS,
    # ENGINE_BACKGROUND_NAME/ENGINE_BACKGROUND_MAX_THREADS, ENGINE_BACKGROUND_COUNT) — siehe README. Die Aufteilung ist gemessen:
    # eine Suche wird von 1 auf 8 Threads nur um den Faktor 1,13 schneller, vier Suchen
    # nebeneinander um fast das Dreifache.

  # ZWEITER CONTAINER ÜBER LICHESS (optional, neben dem direkten)
  # -------------------------------------------------------------
  # Ein Provider bedient genau EINEN Broker. Soll die Engine AUCH über Lichess laufen — für
  # Cloud-Anbieter, für das Analysebrett von lichess.org oder für eine RookHub-Instanz, die noch den
  # Lichess-Weg benutzt —, läuft dafür dieser zweite Container aus demselben Abbild mit eigener
  # .env.lichess (Vorlage .env.lichess.example, OHNE ROOKHUB_URL). Er hängt am Profil `lichess`:
  #   docker compose --profile lichess up -d --build     # beide Container
  #   docker compose --profile lichess down              # beide stoppen — ohne Profil bleibt er stehen
  # Dauerhaft beide: COMPOSE_PROFILES=lichess in die .env, dann gilt jedes `docker compose up/down`
  # für beide. Fehlt die .env.lichess bei aktivem Profil, bricht Compose mit einer klaren Meldung ab;
  # ohne Profil wird sie nicht gebraucht. Beide Container dürfen dieselben Engine-Namen tragen (zwei
  # Server, zwei Registrierungen); liegt der Lichess-Token auch im RookHub-Profil, steht die Engine
  # dort zusätzlich in der Lichess-Liste, als solche markiert. Über Lichess sparsam mit der Zahl der
  # Engines: dessen DDoS-Schutz drosselt je IP (acht gehen, zwölf nicht) — Hintergrund-Engines gehören
  # in den direkten Container.
  engine-provider-lichess:
    build: .
    image: rookhub-engine-provider
    container_name: rookhub-engine-provider-lichess
    profiles: ["lichess"]
    env_file: .env.lichess
    restart: unless-stopped
    init: true
    # cpus: 4

  # ZWEI STOCKFISH-FASSUNGEN NEBENEINANDER (zum Vergleichen/Umschalten)
  # ------------------------------------------------------------------
  # Ein zweiter Dienst aus DERSELBEN Datei, nur mit anderen Bau-Argumenten. So stehen im
  # Analysebrett beide Engines zur Auswahl und man schaltet um, ohne etwas neu zu bauen.
  #
  # Drei Dinge muessen sich unterscheiden, sonst treten sich die beiden gegenseitig auf die Fuesse:
  #   1. `image:` — sonst ueberschreibt der zweite Bau das Abbild des ersten;
  #   2. `container_name:` — sonst laesst Docker den zweiten nicht starten;
  #   3. **die ENGINE-NAMEN** — der Name IST die Registrierung beim Broker. Zwei Provider mit
  #      demselben Namen aktualisieren denselben Eintrag, der zweite entfuehrt also die Engine
  #      des ersten. Deshalb hier `environment:` (schlaegt `env_file:`) mit eigenen Namen.
  #
  # Rechenlast: beide Container deckeln je auf `cpus`. Wer sie GLEICHZEITIG rechnen laesst,
  # belegt die Summe — dafuer sind sie nicht gedacht, sondern zum Umschalten.
  #
  # engine-provider-sf18:
  #   build:
  #     context: .
  #     args:
  #       SF_VERSION: sf_18
  #       SF_ASSET: stockfish-ubuntu-x86-64-avx2.tar
  #       SF_SHA256: 536c0c2c0cf06450df0bfb5e876ef0d3119950703a8f143627f990c7b5417964
  #   image: rookhub-engine-provider:sf18
  #   container_name: rookhub-engine-provider-sf18
  #   env_file: .env
  #   environment:
  #     ENGINE_COUNT: "1"
  #     ENGINE_NAME: "RookHub Server 18"
  #     ENGINE_1_NAME: "RookHub Server 18"
  #   restart: unless-stopped
  #   init: true
  #   cpus: 8
