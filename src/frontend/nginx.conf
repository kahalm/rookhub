# Cache-Control je URI-Klasse (SW-Härtung): index.html ging bisher OHNE Cache-Control raus →
# Browser/Zwischen-Proxys durften heuristisch cachen. Der ngsw validiert Assets per Hash gegen
# ngsw.json; eine stale ausgelieferte index.html/Chunk ⇒ Hash-Mismatch ⇒ ganze App-Version
# invalidiert ⇒ degraded (EXISTING_CLIENTS_ONLY/SAFE_MODE) — der dokumentierte Haupt-Vektor
# (angular.dev/ecosystem/service-workers/devops: „intermediate caching layers").
# Als map statt location-add_header, weil ein add_header IN einer location die server-weiten
# Security-Header (CSP!) NICHT mehr erben würde. Leerer map-Wert ⇒ nginx setzt den Header nicht
# (z. B. API-/OG-Proxy-Antworten bleiben unberührt).
# Reihenfolge: bei Regex-Einträgen gewinnt der ERSTE Treffer — SW-Steuerdateien vor der
# generischen JS-Regel.
# Kartenkacheln des Turnierkalenders. Sie kommen NICHT direkt aus dem Browser von
# openstreetmap.org, sondern ueber RookHub — sonst braucht jeder Betrachter selbst Internet-
# Zugang zu tile.openstreetmap.org. Genau daran scheiterte es (2026-09-06): ueber den
# WireGuard-Weg erreichte der Browser RookHub, aber nicht das offene Netz; die Karte blieb
# schwarz und nur die Marker (Canvas) waren zu sehen. Nebeneffekt: die CSP bleibt bei 'self',
# und der Cache nimmt Last von den OSM-Servern.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=osm_tiles:10m
                 max_size=512m inactive=30d use_temp_path=off;

# Drossel fuer die Kacheln (F8-002): jeder Cache-Fehlgriff geht unter UNSEREM User-Agent zu OSM — ein Skript mit
# zufaelligen z/x/y liesse OSM uns sperren, und die Karte bliebe fuer alle schwarz. Dieser nginx sieht als Adresse nur
# den vorgelagerten Proxy (siehe /api/external-engine/work); die Adresse des Betrachters setzt der Nginx Proxy Manager
# als X-Real-IP (ueberschreibt, was der Client schickt). Fehlt der Kopf (direkter Zugriff), zaehlt $binary_remote_addr.
# Die zweite, gemeinsame Drossel deckelt den Container insgesamt — auch falls der Kopf je nicht verlaesslich waere.
map $http_x_real_ip $rookhub_tile_client {
    default $http_x_real_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $rookhub_tile_client zone=osm_tiles_client:10m rate=20r/s;
limit_req_zone $server_name zone=osm_tiles_all:1m rate=50r/s;

# Kacheln braucht nur die Turnierseite (tournament-map). Dieselbe Konfiguration steckt aber in allen vier Images; die
# drei anderen Seiten erkennt man am Host und sie antworten 404. Unbekannte Hosts (Container-IP, localhost, E2E) bleiben
# offen wie bisher — sonst traefe es genau einen Zugang ueber die Adresse, wie den WireGuard-Weg vom 2026-09-06.
map $host $rookhub_tiles_off {
    default 0;
    ~*^(rookhub|kidhub|leaguehub)  1;
}

map $uri $rookhub_cache_control {
    default "";
    # SW-Steuerdateien: nie cachen (wie bisher; safety-worker = Kill-Switch-Reserve).
    ~^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$  "no-cache, no-store, must-revalidate";
    # Stabil benannte, aber in ngsw.json hash-getrackte Dateien: immer revalidieren (ETag ⇒ 304).
    ~^/(index\.html|manifest\.webmanifest|favicon\.ico|build-info\.json|pwa-install-hook\.js)$  "no-cache, must-revalidate";
    ~^/(i18n|assets|board|piece|icons)/  "no-cache, must-revalidate";
    # SPA-Navigationen, die dieselbe index.html ausliefern (Teilen-Links sind der häufigste
    # Erst-Einstieg!). Ohne Eintrag fielen sie auf `default ""` — also GAR KEIN Cache-Control, und
    # ein Zwischen-Proxy/Browser durfte heuristisch cachen. Nach einem Deploy lud derselbe Link dann
    # eine index.html mit alten Chunk-Hashes → fehlende Chunks bzw. Hash-Mismatch, und der Service
    # Worker degradiert (genau der Vektor, gegen den diese map gebaut wurde).
    ~^/(g|t|l|puzzles|courses|analysis|repertoires|weekly|tournaments)(/|$)  "no-cache, must-revalidate";
    # Hash-benannte Build-Artefakte: unveränderlich ⇒ 1 Jahr immutable (entlastet Update-Downloads).
    "~^/(main|polyfills|chunk|styles|scripts|worker)-[A-Za-z0-9_-]{6,}\.(js|mjs|css)$"  "public, max-age=31536000, immutable";
    ~^/media/  "public, max-age=31536000, immutable";
    # Die Schriftdateien selbst tragen den Inhalts-Hash im Namen (siehe public/fonts) — dauerhaft
    # cachebar. fonts.css NICHT: ihr Name ist stabil, ein Jahr immutable sperrte eine geaenderte
    # Schriftliste genau so lange aus.
    ~^/fonts/.+\.woff2$  "public, max-age=31536000, immutable";
    ~^/fonts/  "no-cache, must-revalidate";
    # Digital Asset Links der TWA: hier statt per add_header in ihrer location — dort verloere die Antwort
    # sonst CSP, nosniff, HSTS und die uebrigen Sicherheits-Header (F8-017). Exakter Eintrag, gewinnt vor jeder Regex.
    /.well-known/assetlinks.json  "public, max-age=3600";
}

# Puffern für den Analyse-Stream der externen Engine ABSCHALTEN — und zwar auch für den
# REVERSE-PROXY, der vor diesem Container steht.
#
# Die API schickt `X-Accel-Buffering: no`, aber nginx VERBRAUCHT diesen Header und reicht ihn
# NICHT weiter: der äußere Proxy sieht ihn nie, puffert die ndjson-Antwort komplett und liefert
# sie erst aus, wenn die Suche fertig ist. Beobachtet in Prod: bei Tiefe 22 mit 3 Varianten
# dauert das >12 s, der Browser bekam bis dahin NULL Bytes (Proxy-Log: Status 499, Length 0),
# gab auf und fiel auf die Browser-Engine zurück („External engine unavailable"). Kurze Suchen
# kamen am Stück durch und wirkten deshalb wie ein sporadischer Fehler.
#
# Deshalb setzt dieser nginx den Header für die Engine-Route SELBST — jeder nginx davor
# schaltet sein Puffern daraufhin ab. Bewusst als map + server-weites add_header (wie schon bei
# Cache-Control): ein `add_header` INNERHALB der location würde die server-weiten
# Security-Header (CSP!) nicht mehr erben. Leerer Wert ⇒ Header wird nicht gesetzt.
map $uri $rookhub_accel_buffering {
    default "";
    ~^/api/engine/  "no";
}

# Welche Seite liefert dieser Container gerade aus? Dieselbe nginx-Konfiguration steckt in ALLEN Images
# (RookHub, Turnierseite, KidHub, LeagueHub, ClubHub) — unterschiedlich ist nur das Bundle. Fuer die
# Link-Vorschau muss die API aber wissen, WELCHE SPA-Shell sie anreichern soll und auf welche Domain
# og:url zeigt: ein geteilter Turnier-Link /t/{id} lebt auf der Turnierseite, RookHub hat die Route
# seit der Trennung nicht mehr. Am Host abzulesen ist zuverlaessiger als ein zweiter Conf-Zweig —
# eine Regel trifft alle Schreibweisen: `tournament` (Prod), `turnier-dev` (Dev) und das aeltere
# `turnier`. Unbekannte Hosts (Container-IP, localhost) bleiben leer = RookHub, also das bisherige
# Verhalten. Der WERT bleibt `turnier`: das ist der Schluessel, den die API kennt.
# KidHub, LeagueHub und ClubHub haben keine Link-Vorschau und keine Routen /g, /t, /puzzles (F8-012): `none`
# laesst die OG-Weiche unten ihre EIGENE index.html ausliefern. Vorher bekamen sie RookHubs Shell, deren
# Bundle-Namen es in ihrem Container nicht gibt — nosniff blockte das Skript, die Seite blieb weiss.
map $host $rookhub_og_site {
    default "";
    ~*^(turnier|tournament)  "turnier";
    ~*^(kidhub|leaguehub|clubhub)  "none";
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cache-Politik aus der map oben; always = auch auf Fehler-Antworten.
    add_header Cache-Control $rookhub_cache_control always;

    # Durchreichen des „nicht puffern"-Signals an einen vorgelagerten Proxy (siehe map oben).
    add_header X-Accel-Buffering $rookhub_accel_buffering always;

    # S-21: Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # "0" statt "1; mode=block": aktuelle Browser haben den XSS-Filter entfernt, in alten war er selbst
    # angreifbar (gezielt ausgeloeste Blockade). Schutz gibt die CSP unten (F8-017).
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Schriften liegen seit der Selbst-Auslieferung unter /fonts/ — die Google-Origins sind aus
    # der Richtlinie raus. Ein blockierendes Stylesheet von dort kostete jeden Betrachter ohne
    # direkten Netzzugang 5-10 s Wartezeit, bevor ueberhaupt etwas zu sehen war.
    # Kartenkacheln laufen ueber /tiles/ (siehe proxy_cache_path oben), sind also gleiche
    # Herkunft — img-src bleibt deshalb bei 'self'. Dazu blob: fuer Bilder, die die Seite selbst erzeugt: das
    # Formular-Foto einer eingelesenen Partie kommt ueber den HttpClient (Anmelde-Token) und wird als blob:-URL
    # angezeigt, ebenso die Vorschau vor dem Hochladen. Ohne blob: blieb das Foto-Fenster leer, ohne Fehlermeldung
    # (0.531.1). Eine blob:-URL kann nur die Seite selbst anlegen — keine fremde Herkunft kommt dadurch herein.
    # worker-src dagegen OHNE blob: (F8-017): Worker kommen nur aus /assets/stockfish, kein Code baut einen aus
    # einer blob:-URL — erlaubt haette es nur eingeschleustem Skript, script-src 'self' fuer Worker zu umgehen.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self';" always;

    # Kachel-Weiterleitung an OpenStreetMap. Der Pfad ist streng auf z/x/y.png begrenzt, damit
    # daraus kein offenes Tor auf beliebige OSM-Adressen wird. Der User-Agent identifiziert die
    # Anwendung, wie es die OSM-Nutzungsbedingungen verlangen; der Cache haelt eine Kachel 30 Tage,
    # damit wir ihre Server nicht mehrfach fuer dasselbe Bild bemuehen.
    # Zoom 0-18 (die Karte hat maxZoom 18), x/y hoechstens sechsstellig (2^18 - 1 = 262143). Die
    # Drossel (siehe limit_req_zone oben) laesst einen schnellen Zoom mit Luft durch: 200 Kacheln
    # sofort, danach 20 je Sekunde; alles darueber bekommt 429 statt einer Anfrage bei OSM.
    location ~ "^/tiles/(?<tile_z>1[0-8]|[0-9])/(?<tile_x>[0-9]{1,6})/(?<tile_y>[0-9]{1,6})\.png$" {
        limit_except GET HEAD { deny all; }
        if ($rookhub_tiles_off) { return 404; }
        limit_req zone=osm_tiles_client burst=200 nodelay;
        limit_req zone=osm_tiles_all burst=1000 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        # Variable statt festem Ziel: mit einem literalen Namen loest nginx EINMAL beim Start auf
        # und behaelt eine veraltete Adresse fuer immer.
        resolver 127.0.0.11 ipv6=off valid=300s;
        set $osm_host tile.openstreetmap.org;
        proxy_pass https://$osm_host/$tile_z/$tile_x/$tile_y.png;

        proxy_ssl_server_name on;
        # Zertifikat des Kachelservers PRUEFEN (N6-005) — nginx tut das per Vorgabe nicht. Ohne die Pruefung
        # nimmt dieser nginx von jedem, der den Weg zu OSM beeinflusst (vergifteter Resolver, Transit), ein
        # beliebiges Zertifikat an und legt dessen Antwort 30 Tage unter UNSERER Herkunft in den Cache. Das
        # Bundle bringt das Alpine-Basisimage mit (ca-certificates-bundle); die Kette ist heute drei Glieder
        # lang (Blatt, Zwischen-CA, Wurzel), Tiefe 3 laesst einer CDN-Kette ein Glied Luft.
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "RookHub/1.0 (+https://rookhub.oberschmid.homes; self-hosted chess portal)";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        proxy_cache osm_tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 410 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        # FALLE: ein add_header in einem location-Block ERSETZT die serverweiten add_header
        # vollstaendig (siehe Kommentar ueber der map weiter oben). Fuer eine Kachel ist von den
        # verworfenen Headern nur einer wirklich wichtig — er kommt deshalb hier erneut: die Bytes
        # stammen von einem FREMDEN Server und werden unter UNSERER Herkunft ausgeliefert, also
        # darf der Browser den Inhaltstyp nicht selbst erraten.
        add_header X-Content-Type-Options "nosniff" always;
        # Eine Kachel ist ein Bild und nie ein Dokument (N6-005): den Inhaltstyp des Fremdservers verwerfen
        # (nosniff verhindert ein ausdruecklich deklariertes text/html nicht) und die Antwort ohne Skript und
        # in eigener, undurchsichtiger Herkunft ausliefern. Content-Type bewusst OHNE always: auf den von nginx
        # selbst erzeugten 404/429 stuende er sonst neben dem text/html der Fehlerseite doppelt.
        proxy_hide_header Content-Type;
        add_header Content-Type "image/png";
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Tile-Cache $upstream_cache_status;
        expires 30d;
    }

    # WASM MIME type
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
    }

    # ES-Module (.mjs): mime.types von nginx kennt die Endung nicht → application/octet-stream, und ein
    # Modul mit falschem Typ lehnt der Browser ab. onnxruntime (Maia-Sparring) lädt seinen WASM-Kleber
    # per import() — ohne diese Regel: „Failed to fetch dynamically imported module".
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
    }

    # (Die frühere SW-Sonder-location ist in der $rookhub_cache_control-map aufgegangen —
    #  dadurch erben die SW-Dateien jetzt auch wieder ALLE Security-Header.)

    # External-Engine-Analyse (ndjson-Stream, RookHub → Lichess-Broker → Provider des Users).
    # Braucht eine EIGENE location, weil die generische /api/-Regel zwei Dinge falsch machen würde:
    # (1) proxy_buffering sammelt die Antwort, statt jede info-Zeile sofort durchzureichen (die API
    #     schickt zwar X-Accel-Buffering: no, aber hier steht es dauerhaft und sichtbar), und
    # (2) proxy_read_timeout (Default 60 s) kappt eine tiefe Suche, wenn zwischen zwei Zeilen mal
    #     länger nichts kommt — die Analyse bräche dann mitten im Rechnen ab.
    # Längster Prefix gewinnt gegenüber /api/. Alle /api/-Locations tragen ^~: damit greift
    # KEINE Regex-Location auf API-Pfade — vor allem nicht die Scanner-Regeln weiter unten, die
    # /api/.env sonst vor der API abfingen. Die API soll solche Anfragen sehen und loggen, sonst
    # wird der log-watcher (suspicious_requests) für Scans der API blind.
    location ^~ /api/engine/ {
        resolver 127.0.0.11 valid=30s;
        set $rookhub_engine_api api:8080;
        proxy_pass http://$rookhub_engine_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Eigener Engine-Broker: der Provider auf dem Rechner des Nutzers holt hier Arbeit (Long-Poll, 10 s)
    # und lädt die Suche als CHUNKED-Upload hoch — eine Zeile je Engine-Ausgabe, solange die Engine
    # rechnet (Minuten bis Stunden, bei tiefer MultiPV-Suche nur alle 15 s ein Lebenszeichen).
    # (1) proxy_request_buffering off: sonst sammelt nginx den GANZEN Upload, bevor die API ein Byte
    #     sieht — der Anfragende bekäme die erste Zeile erst nach dem Ende der Suche.
    # (2) client_max_body_size 0: ein Upload hat keine Größe, er hat eine Dauer.
    # (3) lange Timeouts: der Upload schweigt minutenlang zwischen zwei tiefen Iterationen.
    # Davor steht in Prod/Dev der Nginx Proxy Manager: dort braucht /api/external-engine/ dieselben
    # Direktiven als Custom Location (Deploy-Schritt außerhalb des Repos, siehe CLAUDE.md „Externe Engine").
    # DeploymentConfigTests hält die Direktiven fest.
    #
    # FALLE: die Registrierung heißt /api/external-engine OHNE Schrägstrich (Lichess-Pfad, GET/POST). Für
    # genau diese URI beantwortet nginx eine Präfix-location mit Schrägstrich und proxy_pass SELBST mit
    # 301 auf „…/" — an den internen Port (8080), wo der Provider ins Leere lief (gefunden mit dem echten
    # Provider im E2E-Stack: SSL-Fehler an einem fremden Dienst, keine einzige Registrierung). Die exakte
    # location darunter nimmt der Präfix-Regel diese URI weg; sie ist klein und selten, also /api/-Regeln.
    location = /api/external-engine {
        resolver 127.0.0.11 valid=30s;
        set $rookhub_api api:8080;
        proxy_pass http://$rookhub_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15M;
    }

    # Der Long-Poll des Providers (POST /api/external-engine/work) als EXAKTE location: unter der Präfix-Regel darunter
    # galt für ihn „client_max_body_size 0" — gemeint für den Upload /work/{id}, der keine Größe hat, nicht für den
    # Poll. Dessen Rumpf ist {"providerSecret":"…"}: echte Provider schicken unter 200 Byte, die API nimmt bis 4 KB
    # ([RequestSizeLimit] an Acquire). Ohne diese Grenze reichte nginx je anonymem Poll bis zu Kestrels 30 MB durch.
    # Bewusst KEIN limit_req: dieser nginx sieht nur die Adresse des vorgelagerten Proxys, eine Drossel hier träfe
    # alle Provider gemeinsam — die Drossel je Client-Adresse für unbekannte Selectors macht die API.
    # DeploymentConfigTests hält die Grenze über dem API-Deckel und klein.
    location = /api/external-engine/work {
        resolver 127.0.0.11 valid=30s;
        set $rookhub_broker_api api:8080;
        proxy_pass http://$rookhub_broker_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 8k;
    }

    location ^~ /api/external-engine/ {
        resolver 127.0.0.11 valid=30s;
        set $rookhub_broker_api api:8080;
        proxy_pass http://$rookhub_broker_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # RepCheck-Browser-Import (Chessable). Eigene location, weil die generische /api/-Regel den Rumpf auf
    # 15 MB deckelt — die API nimmt für diese Endpunkte bis 64 MB an ([RequestSizeLimit] im
    # ExtensionController). Am 2026-09-14 lehnte nginx deshalb „Mitschnitt importieren" eines Kurses mit
    # ~470-KB-Linien ab rund 27 Linien mit 413 ab; die API sah die Anfrage nie. Die Zeitschranke ist
    # länger, weil ein großer Kurs beim Parsen durch piratechess die 60-s-Vorgabe überschreiten kann.
    # DeploymentConfigTests hält das Limit über dem größten [RequestSizeLimit] dieser Endpunkte.
    location ^~ /api/extension/chessable/ {
        resolver 127.0.0.11 valid=30s;
        set $rookhub_ext_api api:8080;
        proxy_pass http://$rookhub_ext_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Partieformular einlesen: bis zu drei Fotos in EINER Anfrage (0.600.0, mehrseitige Formulare). Die generische
    # /api/-Regel deckelt auf 15 MB — drei Handyfotos zu je 5–8 MB kämen nie bei der API an (413). Die API nimmt bis
    # 64 MB ([RequestSizeLimit] am ScoresheetsController, DeploymentConfigTests hält beide zusammen).
    location ^~ /api/scoresheets {
        resolver 127.0.0.11 valid=30s;
        set $rookhub_sheet_api api:8080;
        proxy_pass http://$rookhub_sheet_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # RookHub API
    location ^~ /api/ {
        # Upstream zur Laufzeit ueber Dockers internen DNS aufloesen, statt
        # fest beim Start. Verhindert "[emerg] host not found in upstream api",
        # wenn der api-Container beim (Re)Start noch nicht im DNS registriert
        # ist. Die Variable im proxy_pass ist der Schalter dafuer; resolver
        # nennt nginx den DNS-Server, valid cacht das Ergebnis kurz.
        resolver 127.0.0.11 valid=30s;
        set $rookhub_api api:8080;
        proxy_pass http://$rookhub_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15M;

        # LeagueHub: Formular-Foto der Vereins-Datenbank hochladen, angemeldet und über einen Teilen-Link (A6-020). Die
        # API nimmt je Foto bis 30 MB ([RequestSizeLimit] an beiden Upload-Actions des LeagueClubController) — unter den
        # 15 MB hier antwortete nginx einem 50- oder 108-MP-Handyfoto mit einer HTML-413, die API sah es nie, und die
        # Seite meldete nur „Hochladen hat nicht geklappt". VERSCHACHTELT, weil der Teilen-Link ein Token im Pfad trägt
        # und Regex-Locations auf oberster Ebene wegen ^~ für /api/ nie greifen. resolver und proxy_set_header erbt sie,
        # set und proxy_pass nicht. Nur genau diese Pfade: die übrigen Teilen-Endpunkte sind anonym und bleiben bei
        # 15 MB. DeploymentConfigTests hält die Grenze über der der API.
        location ~ ^/api/league/(club|s/[^/]+/club)/scans$ {
            set $rookhub_api api:8080;
            proxy_pass http://$rookhub_api$request_uri;
            client_max_body_size 32M;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # Digital Asset Links fuer die Android-TWA (Google Play) — verifiziert Domain<->App.
    # Datei liegt in public/.well-known/; SHA-256-Fingerprint vor dem Release eintragen.
    # Cache-Control kommt aus der $rookhub_cache_control-map: KEIN add_header hier, sonst fielen die Sicherheits-Header weg.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Scanner-Pfade: Konfigurations-, Backup-, Skript- und Archivdateien gibt es in dieser App nicht.
    # Ohne diese Regeln beantwortete der SPA-Fallback sie mit 200 und der Startseite. Preisgegeben
    # wurde nichts, aber für einen Scanner ist jede 200 ein Treffer — am 2026-09-17 waren es 291
    # von 313 Anfragen eines einzigen .env-Scans. DeploymentConfigTests prüft die Muster gegen
    # echte Scanner-Pfade UND gegen Dateien und Routen der App.
    # Reihenfolge: bei Regex-Locations gewinnt der ERSTE Treffer, deshalb stehen sie vor der
    # OG-Weiche. /.well-known/assetlinks.json ist oben exakt eingetragen und gewinnt vor jeder
    # Regex; die /api/-Locations sind per ^~ ausgenommen.
    location ~ /\. {
        return 404;
    }
    # /env.old, /env.production — dieselben Dateien ohne führenden Punkt.
    location ~* (^|/)env(\.[^/]*)?$ {
        return 404;
    }
    location ~* \.(php[0-9]?|phtml|phar|asp|aspx|jsp|cgi|py|sh|env|ini|conf|config|cfg|toml|ya?ml|bak|bkp|backup|old|orig|save|swp|tmp|sql|sqlite3?|db|log|tar|tgz|gz|bz2|zip|rar|7z)$ {
        return 404;
    }
    location ~* ^/(wp-|wordpress|xmlrpc|phpmyadmin|pma(/|$)|cgi-bin|vendor/) {
        return 404;
    }

    # Link-Vorschau (Open Graph / Twitter Card): die OEFFENTLICHEN Routen (geteilte Partie /g/,
    # Turnier /t/, Puzzles /puzzles/) gehen an den OG-Renderer der API. Der holt die echte index.html
    # (dieser nginx) und reichert sie mit stellungsspezifischen Meta-Tags an — Menschen bekommen die
    # normale SPA (die Bootstrap-Scripts bleiben unveraendert), Crawler lesen die Tags. Der Original-
    # Pfad wird per X-Original-URI durchgereicht. Muss VOR dem SPA-Fallback stehen.
    location ~ ^/(g|t|puzzles)(/|$) {
        # Seiten ohne Vorschau (siehe map $rookhub_og_site): die eigene SPA-Shell, deren Router den Pfad abfaengt.
        if ($rookhub_og_site = none) { rewrite ^ /index.html last; }
        resolver 127.0.0.11 valid=30s;
        set $rookhub_og_api api:8080;
        proxy_pass http://$rookhub_og_api/api/og/render;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Og-Site $rookhub_og_site;
        # Cache-Control kommt aus der $rookhub_cache_control-map (no-cache, must-revalidate — wie jede index.html);
        # das „public, max-age=300" der API stand sonst als zweiter, widerspruechlicher Header daneben (F8-012).
        proxy_hide_header Cache-Control;
        # Schlägt der OG-Renderer fehl (API down/Fehler/nicht erreichbar), NICHT die Fehlerseite
        # ausliefern, sondern die normale SPA — die Vorschau-Anreicherung entfällt dann nur.
        # 429 gehört dazu: der Limiter der API zählt je IP, und ohne diesen Eintrag reichte nginx
        # seine Absage als Dokument durch — der Browser zeigte statt der App eine weiße Seite
        # (im E2E-Lauf aufgefallen, dort teilen sich alle Tests eine IP).
        proxy_intercept_errors on;
        proxy_connect_timeout 3s;
        error_page 429 500 502 503 504 = @og_fallback;
    }

    # Fallback: normale SPA-index.html ohne Meta-Anreicherung.
    location @og_fallback {
        try_files /index.html =404;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
