<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RookHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Der Turm der App auch im Tab: die .ico trug bis hierher noch das Angular-Logo.
       SVG zuerst (scharf in jeder Größe), PNG und .ico als Rückfall für ältere Browser. -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3f51b5">
  <!-- Selbst ausgeliefert statt von fonts.googleapis.com: ein blockierendes Stylesheet von dort
       laesst die Seite in den Timeout laufen, wenn der Browser das offene Netz nicht erreicht
       (ueber WireGuard gemessen: 5-10 s bis zum ersten Bild). -->
  <link href="fonts/fonts.css" rel="stylesheet">
  <!-- PWA-Install-Event frueh abfangen (extern statt inline → CSP-konform, siehe pwa-install-hook.js). -->
  <script src="pwa-install-hook.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
