name: Board-Train-Image

# Trainingsdienst fürs Brettfeld-Netz (tools/board-train) → ghcr.io/<owner>/rookhub-board-train (arm64, DGX Spark).
# Eigenständig: hängt an keinem Release-Tag und keinem Test-Gate — der Dienst läuft nur auf dem Spark, nie auf Prod.
on:
  push:
    branches: [master]
    paths:
      - 'tools/board-train/**'
      - '.github/workflows/board-train.yml'
  workflow_dispatch:

permissions: {}

jobs:
  image:
    # Nativer arm64-Runner: kein QEMU, PyTorch-Räder passen direkt zum Spark.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name (Kleinbuchstaben)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rookhub-board-train" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/board-train
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
      - name: Rauchtest (Import, Hilfe)
        run: docker run --rm --entrypoint python "${{ steps.name.outputs.image }}:${{ github.sha }}" /app/train.py --help
