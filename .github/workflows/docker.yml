name: Build & Push Docker Images

on:
  push:
    branches: [master]
    tags: ['v*']
  # Von Hand ausloesbar (`gh workflow run docker.yml`) — und dann laeuft ALLES, genau wie bei
  # einem Tag. Gebraucht fuer den Fall, den die Pfadfilter erzeugen: ein Push auf master ist rot
  # (hier: fremdverschuldet geerbt), der reparierende Push beruehrt nur Frontend-Pfade, und damit
  # ist `build-api` seit zwei Versionen nicht mehr gelaufen. Der master-Stand ist dann gruen und
  # gepusht, aber es gibt kein Image dazu — ohne diesen Knopf hilft nur ein Alibi-Commit in den
  # richtigen Pfad. Aufgetreten am 2026-09-09: 0.453.0/0.453.1 rot, 0.453.2 gruen, aber
  # `build-api: skipped` — auf Dev lief noch der Stand von 0.452.1.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Welche Bereiche hat dieser Push angefasst? Muster in `.github/filters.yml` (dieselbe Datei
  # steuert die Test-Jobs). Ein TAG-Lauf baut IMMER alle drei Images: `:latest` entsteht nur dort,
  # und ein Release mit einem ausgelassenen Image waere unvollstaendig.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      turnier: ${{ steps.filter.outputs.turnier }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Beim Handstart gibt es keinen Vorgaenger-Stand zum Vergleichen (dorny hielte master gegen
      # master und setzte alles auf `false`). Der Schritt bleibt deshalb aus, die Outputs sind
      # leer — und die Job-Bedingungen unten fangen den Fall ueber `github.event_name` ab.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: .github/filters.yml

  # Test-Gate: blockiert alle Image-Pushes, bis Tests grün sind (reusable test.yml)
  #
  # Die Rechte MUESSEN hier stehen, und zwar als OBERGRENZE fuer alles, was test.yml verlangt:
  # ein aufgerufener Workflow darf nicht mehr haben als der aufrufende Job. Die Repo-Vorgabe ist
  # `contents: read` — verlangt dort ein Job `pull-requests: read` (dorny/paths-filter braucht es
  # im pull_request-Fall) und steht es hier nicht, weist GitHub den GANZEN Lauf ab, bevor ein
  # Schritt laeuft: `startup_failure`, keine Jobs, kein Image, und in der API keine Annotation,
  # die es erklaert. Genau so gesehen bei v0.434.2 und v0.434.3.
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: read

  # Cache-Vorlauf: baut dieselben drei Images wie unten, aber OHNE Push — und vor allem OHNE auf
  # `tests` zu warten. Der Zweck ist allein der Schichten-Cache: geht das Gate auf, findet der echte
  # Build unten alles fertig vor und muss im Wesentlichen nur noch hochladen.
  #
  # Warum das noetig war (gemessen am Lauf 35502561832, 2026-09-20, 5:04 gesamt): es gab bis dahin
  # GAR KEINEN Docker-Cache — jeder Lauf zog die Basis-Images neu, machte `dotnet restore` neu und
  # installierte stockfish neu. `build-api` brauchte dafuer 1:34, und diese 1:34 lagen vollstaendig
  # auf dem kritischen Pfad, weil sie erst NACH dem Test-Gate begannen.
  #
  # Das Gate selbst bleibt unangetastet: gepusht wird weiterhin NUR unten, nach gruenen Tests. Hier
  # entsteht nichts, was irgendwer konsumieren koennte — `outputs: type=cacheonly` heisst, das Image
  # wird gebaut und weggeworfen, zurueck bleibt ausschliesslich der Cache.
  #
  # Der Preis sind doppelte Runner-Minuten. rookhub ist oeffentlich, die sind kostenlos.
  prebuild:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Reiner Beschleuniger, NIEMALS ein Gate: zickt der Cache-Dienst oder faellt ein Vorlauf aus
    # anderem Grund um, soll der LAUF nicht rot werden. Der echte Build unten baut dann eben wieder
    # von vorn — also genau so, wie es vor diesem Job immer war.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Der Filter-Output steht AUSGESCHRIEBEN in der Matrix (`needs.changes.outputs.api`), nicht
          # als `outputs[matrix.image]`. Beides funktioniert — aber `CiWorkflowTests` liest die
          # abgefragten Filternamen per Regex aus der Datei und kennt nur die ausgeschriebene Form.
          # Ein dynamischer Index waere fuer den Test unsichtbar, und ein umbenannter Filter machte
          # den Vorlauf still wirkungslos: genau die Sorte Fehler, gegen die der Test da ist.
          - image: api
            context: src/api/RookHub.Api
            build-args: ''
            wanted: ${{ needs.changes.outputs.api }}
          - image: frontend
            context: src/frontend
            build-args: APP_PROJECT=app
            wanted: ${{ needs.changes.outputs.frontend }}
          - image: turnier
            context: src/frontend
            build-args: APP_PROJECT=turnier
            wanted: ${{ needs.changes.outputs.turnier }}
    # Dieselbe Bedingung wie beim zugehoerigen Build-Job unten, nur einmal hingeschrieben statt
    # dreimal: fuer ein Image, das dieser Push ohnehin nicht baut, soll auch kein Cache entstehen.
    env:
      WANTED: >-
        ${{ github.event_name == 'workflow_dispatch'
            || startsWith(github.ref, 'refs/tags/v')
            || matrix.wanted == 'true' }}
    steps:
      - uses: actions/checkout@v6
        if: env.WANTED == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.WANTED == 'true'
      - uses: docker/build-push-action@v7
        if: env.WANTED == 'true'
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          # Kein Push, kein `load` — nur der Cache soll ueberleben.
          outputs: type=cacheonly
          # `scope` MUSS je Image gesetzt sein, sonst ueberschreiben sich die drei gegenseitig:
          # die Vorgabe ist der Branch-Name, und der ist fuer alle drei derselbe.
          # `mode=max` ist Pflicht, nicht Kuer — der teure Teil steckt in der BUILD-Stage
          # (`dotnet restore` bzw. `npm ci` + `ng build`), und die exportiert `mode=min` nicht mit.
          # Im Blick behalten: der Actions-Cache fasst 10 GB pro Repo und wirft dann die aeltesten
          # Eintraege weg. Wird es eng, ist Registry-Cache in ghcr die Alternative
          # (`type=registry,ref=ghcr.io/kahalm/rookhub-api:buildcache`).
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build-api:
    needs: [changes, tests]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (github.event_name == 'workflow_dispatch'
              || startsWith(github.ref, 'refs/tags/v')
              || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      # Ohne Buildx laeuft der Build im klassischen docker-Treiber, und DER kann keinen Cache
      # importieren — `cache-from` waere still wirkungslos.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-api
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: src/api/RookHub.Api
          push: true
          # Liegt schon da, wenn `prebuild` parallel zu den Tests durchgelaufen ist — dann bleibt
          # hier fast nur noch der Upload nach ghcr. Fehlt der Cache (Vorlauf uebersprungen,
          # fehlgeschlagen oder aus dem 10-GB-Kontingent verdraengt), baut der Schritt einfach von
          # vorn; der Lauf wird dadurch nur langsamer, nie falsch.
          cache-from: type=gha,scope=api
          tags: ${{ steps.meta.outputs.tags }}

  build-frontend:
    needs: [changes, tests]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (github.event_name == 'workflow_dispatch'
              || startsWith(github.ref, 'refs/tags/v')
              || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      # Ohne Buildx laeuft der Build im klassischen docker-Treiber, und DER kann keinen Cache
      # importieren — `cache-from` waere still wirkungslos.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-frontend
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: src/frontend
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          # Liegt schon da, wenn `prebuild` parallel zu den Tests durchgelaufen ist — dann bleibt
          # hier fast nur noch der Upload nach ghcr. Fehlt der Cache (Vorlauf uebersprungen,
          # fehlgeschlagen oder aus dem 10-GB-Kontingent verdraengt), baut der Schritt einfach von
          # vorn; der Lauf wird dadurch nur langsamer, nie falsch.
          cache-from: type=gha,scope=frontend
          tags: ${{ steps.meta.outputs.tags }}

  # Turnierseite (turnier.oberschmid.homes): dasselbe Frontend-Verzeichnis, dasselbe Dockerfile —
  # nur ein anderes Angular-Projekt des Workspaces (APP_PROJECT). Eigenes Image, damit die beiden
  # Seiten getrennt ausgerollt werden koennen.
  build-turnier:
    needs: [changes, tests]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (github.event_name == 'workflow_dispatch'
              || startsWith(github.ref, 'refs/tags/v')
              || needs.changes.outputs.turnier == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      # Ohne Buildx laeuft der Build im klassischen docker-Treiber, und DER kann keinen Cache
      # importieren — `cache-from` waere still wirkungslos.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-turnier
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: src/frontend
          push: true
          build-args: |
            APP_PROJECT=turnier
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          # Liegt schon da, wenn `prebuild` parallel zu den Tests durchgelaufen ist — dann bleibt
          # hier fast nur noch der Upload nach ghcr. Fehlt der Cache (Vorlauf uebersprungen,
          # fehlgeschlagen oder aus dem 10-GB-Kontingent verdraengt), baut der Schritt einfach von
          # vorn; der Lauf wird dadurch nur langsamer, nie falsch.
          cache-from: type=gha,scope=turnier
          tags: ${{ steps.meta.outputs.tags }}
