name: Build & Push Docker Images

on:
  push:
    branches: [master]
    tags: ['v*']
  # Von Hand ausloesbar (`gh workflow run docker.yml`) — und dann laeuft ALLES, genau wie bei
  # einem Tag. Gebraucht fuer den Fall, den die Pfadfilter erzeugen: ein Push auf master ist rot
  # (hier: fremdverschuldet geerbt), der reparierende Push beruehrt nur Frontend-Pfade, und damit
  # ist `build-api` seit zwei Versionen nicht mehr gelaufen. Der master-Stand ist dann gruen und
  # gepusht, aber es gibt kein Image dazu — ohne diesen Knopf hilft nur ein Alibi-Commit in den
  # richtigen Pfad. Aufgetreten am 2026-09-09: 0.453.0/0.453.1 rot, 0.453.2 gruen, aber
  # `build-api: skipped` — auf Dev lief noch der Stand von 0.452.1.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Welche Bereiche hat dieser Push angefasst? Muster in `.github/filters.yml` (dieselbe Datei
  # steuert die Test-Jobs). Ein TAG-Lauf baut IMMER alle drei Images: `:latest` entsteht nur dort,
  # und ein Release mit einem ausgelassenen Image waere unvollstaendig.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      turnier: ${{ steps.filter.outputs.turnier }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Beim Handstart gibt es keinen Vorgaenger-Stand zum Vergleichen (dorny hielte master gegen
      # master und setzte alles auf `false`). Der Schritt bleibt deshalb aus, die Outputs sind
      # leer — und die Job-Bedingungen unten fangen den Fall ueber `github.event_name` ab.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: .github/filters.yml

  # Test-Gate: blockiert alle Image-Pushes, bis Tests grün sind (reusable test.yml)
  #
  # Die Rechte MUESSEN hier stehen, und zwar als OBERGRENZE fuer alles, was test.yml verlangt:
  # ein aufgerufener Workflow darf nicht mehr haben als der aufrufende Job. Die Repo-Vorgabe ist
  # `contents: read` — verlangt dort ein Job `pull-requests: read` (dorny/paths-filter braucht es
  # im pull_request-Fall) und steht es hier nicht, weist GitHub den GANZEN Lauf ab, bevor ein
  # Schritt laeuft: `startup_failure`, keine Jobs, kein Image, und in der API keine Annotation,
  # die es erklaert. Genau so gesehen bei v0.434.2 und v0.434.3.
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: read


  # ------------------------------------------------------------------------------------------
  # VORBAU: baut die Images parallel zu den Tests und legt sie unter einem Hilfs-Tag
  # (`ci-<run_id>`) in ghcr ab. Die Build-Jobs unten bauen danach GAR NICHT mehr — sie haengen
  # nur noch die echten Tags an dasselbe Image (`docker buildx imagetools create`, eine reine
  # Registry-Operation von wenigen Sekunden, unabhaengig von der Image-Groesse).
  #
  # Warum dieser Weg und nicht der naheliegende Schichten-Cache: genau das war v0.493.3, und es
  # half beim API-Image nicht. Gemessen (Lauf 35503421281): der Vorbau brauchte mit
  # `cache-to: type=gha,mode=max` 4:00 fuer einen Build von 1:44 — der Export der ganzen
  # .NET-SDK-Stage in den Actions-Cache kostet mehr als der Build selbst. Der Cache war damit
  # 1:12 NACH dem Start von `build-api` fertig, also wertlos, und der Lauf blieb bei 4:43. Bei
  # den beiden Frontend-Images ging es auf (1:02 -> 0:32 bzw. 0:50 -> 0:36), beim API nicht.
  # Ohne Cache-Export baut und pusht der Vorbau in ~1:45 und ist lange vor dem Gate fertig.
  #
  # Das Gate bleibt, was es war: `:dev`, `:latest` und die Semver-Tags — alles, was Watchtower
  # und der Deploy lesen — entstehen ausschliesslich unten, nach gruenen Tests. Neu ist, dass
  # die Image-BYTES schon vorher in ghcr liegen, unter einem Tag, den nichts konsumiert.
  # Bleibt ein `ci-*`-Tag uebrig, war es ein Lauf mit roten Tests; er zeigt auf ein Image, das
  # nie ausgeliefert wurde. Wegraeumen ist Kosmetik (oeffentliches Repo, Speicher kostenlos) —
  # wenn es stoert, gehoert das in einen eigenen, zeitgesteuerten Aufraeum-Workflow und NICHT
  # hierher: die echten Tags zeigen auf dieselben Schichten.
  # ------------------------------------------------------------------------------------------

  prebuild-api:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: src/api/RookHub.Api
          push: true
          tags: ${{ env.REGISTRY }}/kahalm/rookhub-api:ci-${{ github.run_id }}

  prebuild-frontend:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GIT_SHA/GIT_REF muessen HIER stehen, nicht unten: unten wird nicht mehr gebaut. Sie
      # landen als /build-info.json im Image, damit die Admin-CI-Seite den Lauf markieren kann.
      - uses: docker/build-push-action@v7
        with:
          context: src/frontend
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/kahalm/rookhub-frontend:ci-${{ github.run_id }}

  prebuild-turnier:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.turnier == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: src/frontend
          push: true
          build-args: |
            APP_PROJECT=turnier
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/kahalm/rookhub-turnier:ci-${{ github.run_id }}

  # ------------------------------------------------------------------------------------------
  # DAS GATE: ab hier entstehen die Tags, die ausgeliefert werden. Kein Build mehr, nur Umhaengen.
  # Kein `actions/checkout` noetig — es wird nichts aus dem Arbeitsbaum gelesen.
  # ------------------------------------------------------------------------------------------

  build-api:
    needs: [changes, tests, prebuild-api]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (github.event_name == 'workflow_dispatch'
              || startsWith(github.ref, 'refs/tags/v')
              || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-api
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Echte Tags an das vorgebaute Image haengen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ env.REGISTRY }}/kahalm/rookhub-api:ci-${{ github.run_id }}
        run: |
          mapfile -t tags < <(grep -v '^[[:space:]]*$' <<< "$TAGS")
          test ${#tags[@]} -gt 0
          printf 'Quelle: %s\n' "$SOURCE"
          printf 'Ziel:   %s\n' "${tags[@]}"
          docker buildx imagetools create "${tags[@]/#/--tag=}" "$SOURCE"

  build-frontend:
    needs: [changes, tests, prebuild-frontend]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (github.event_name == 'workflow_dispatch'
              || startsWith(github.ref, 'refs/tags/v')
              || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-frontend
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Echte Tags an das vorgebaute Image haengen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ env.REGISTRY }}/kahalm/rookhub-frontend:ci-${{ github.run_id }}
        run: |
          mapfile -t tags < <(grep -v '^[[:space:]]*$' <<< "$TAGS")
          test ${#tags[@]} -gt 0
          printf 'Quelle: %s\n' "$SOURCE"
          printf 'Ziel:   %s\n' "${tags[@]}"
          docker buildx imagetools create "${tags[@]/#/--tag=}" "$SOURCE"

  # Turnierseite (turnier.oberschmid.homes): dasselbe Frontend-Verzeichnis, dasselbe Dockerfile —
  # nur ein anderes Angular-Projekt des Workspaces (APP_PROJECT). Eigenes Image, damit die beiden
  # Seiten getrennt ausgerollt werden koennen.
  build-turnier:
    needs: [changes, tests, prebuild-turnier]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (github.event_name == 'workflow_dispatch'
              || startsWith(github.ref, 'refs/tags/v')
              || needs.changes.outputs.turnier == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-turnier
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Echte Tags an das vorgebaute Image haengen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ env.REGISTRY }}/kahalm/rookhub-turnier:ci-${{ github.run_id }}
        run: |
          mapfile -t tags < <(grep -v '^[[:space:]]*$' <<< "$TAGS")
          test ${#tags[@]} -gt 0
          printf 'Quelle: %s\n' "$SOURCE"
          printf 'Ziel:   %s\n' "${tags[@]}"
          docker buildx imagetools create "${tags[@]/#/--tag=}" "$SOURCE"
