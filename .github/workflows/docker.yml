name: Build & Push Docker Images

on:
  push:
    branches: [master]
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  # Welche Bereiche hat dieser Push angefasst? Muster in `.github/filters.yml` (dieselbe Datei
  # steuert die Test-Jobs). Ein TAG-Lauf baut IMMER alle drei Images: `:latest` entsteht nur dort,
  # und ein Release mit einem ausgelassenen Image waere unvollstaendig.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      turnier: ${{ steps.filter.outputs.turnier }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/filters.yml

  # Test-Gate: blockiert alle Image-Pushes, bis Tests grün sind (reusable test.yml)
  tests:
    uses: ./.github/workflows/test.yml

  build-api:
    needs: [changes, tests]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-api
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: src/api/RookHub.Api
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  build-frontend:
    needs: [changes, tests]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-frontend
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: src/frontend
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}

  # Turnierseite (turnier.oberschmid.homes): dasselbe Frontend-Verzeichnis, dasselbe Dockerfile —
  # nur ein anderes Angular-Projekt des Workspaces (APP_PROJECT). Eigenes Image, damit die beiden
  # Seiten getrennt ausgerollt werden koennen.
  build-turnier:
    needs: [changes, tests]
    if: >-
      ${{ needs.tests.result != 'failure' && needs.tests.result != 'cancelled'
          && (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.turnier == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-turnier
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: src/frontend
          push: true
          build-args: |
            APP_PROJECT=turnier
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
