name: Build Android TWA (AAB)

# Manuell ausgelöst: baut aus twa/twa-manifest{,.dev}.json einen signierten Android
# App Bundle (AAB) + APK und lädt ihn als Artefakt hoch.
#
# DREI Jobs, damit der Signaturschlüssel nie neben fremdem Code liegt (Codereview W2, I1-005):
#   build   — Toolchain + Bubblewrap (npm-Baum), baut UNSIGNIERT; keine Secrets, contents: read.
#   sign    — nur die Build-Tools des Runner-SDKs (apksigner) und jarsigner aus dessen JDK, kein npm,
#             keine Fremd-Action; die Secrets gibt es nur hier, contents: read.
#   release — nur prod: hängt die signierten Dateien ans Release; contents: write, aber KEINE Secrets.
# Der Schlüssel für direkt verteilte APKs ist nicht rotierbar — wer ihn abgreift, kann Updates
# der installierten App signieren. Vorher lagen Keystore und Passwörter im selben Job wie
# `npm install -g` (Transitive ohne Lockfile, Install-Skripte aktiv), zwei per beweglichem Tag
# eingebundene Fremd-Actions und ein GITHUB_TOKEN mit contents: write.
# Alle Actions sind per Commit-SHA festgenagelt (Kommentar = Version); beim Anheben SHA + Kommentar
# gemeinsam ändern. Bubblewrap kommt aus twa/bubblewrap/package-lock.json (`npm ci --ignore-scripts`).
#
# Für die 'prod'-Variante wird die frische APK/AAB ZUSÄTZLICH an ein GitHub-Release
# `v<APP_VERSION>` gehängt und als "latest" markiert — damit der /install-Download-Link
# (releases/latest/download/app-release-signed.apk) immer die aktuelle App liefert.
#
# Variant 'prod' → twa-manifest.json (rookhub.oberschmid.homes, Play-Store-App)
# Variant 'dev'  → twa-manifest.dev.json (rookhub-dev.oberschmid.homes,
#                                          separater packageId, parallel installierbar)
#
# Benötigte Repository-Secrets:
#   ANDROID_KEYSTORE_BASE64    - base64 -w0 android.keystore
#   ANDROID_KEYSTORE_PASSWORD  - Keystore-Passwort
#   ANDROID_KEY_PASSWORD       - Schlüssel-Passwort (Alias: rookhub)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (prod = Play Store, dev = rookhub-dev.oberschmid.homes)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

jobs:
  build:
    runs-on: ubuntu-latest
    # Nur lesen — hier laeuft der ganze npm-Baum von Bubblewrap, also weder Secrets noch Schreibrecht.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      key_alias: ${{ steps.manifest.outputs.key_alias }}
    steps:
      # Kein Token in .git/config (bzw. der von checkout eingebundenen Datei) fuer die folgenden
      # Schritte. `git ls-remote` im Tag-Guard geht anonym — das Repo ist oeffentlich.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # ACHTUNG Reihenfolge: „Read app version" + der Guard darunter stehen BEWUSST ganz
      # vorn — vor setup-java/Android-SDK/Bubblewrap. Ein Abbruch wegen fehlendem/falschem
      # Tag darf nicht erst nach dem ~10-Minuten-Android-Build kommen. Beide Schritte
      # brauchen nur den Checkout (grep + git ls-remote), keinerlei Toolchain.
      #
      # Nur prod: App-Version aus changelog.ts lesen (Single Source, siehe CLAUDE.md).
      - name: Read app version
        if: inputs.variant == 'prod'
        id: ver
        run: |
          v=$(grep -oE "APP_VERSION = '[0-9.]+'" src/frontend/app/src/environments/changelog.ts | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$v" ]; then echo "APP_VERSION nicht gefunden"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "App version: $v"

      # FALLE 1 (Tag fehlt): action-gh-release legt einen fehlenden Tag STILL selbst an — auf
      # dem Dispatch-Stand. Von GITHUB_TOKEN erzeugte Tags loesen keine Workflows aus, d. h.
      # fuer dieses "latest"-Release wuerde NIE ein :latest-Docker-Image gebaut: Release
      # vX.Y.Z, Images aber noch vom vorigen Tag. Darum hart abbrechen, wenn der Tag fehlt.
      #
      # FALLE 2 (Tag zeigt woanders hin): existiert v$v bereits auf einem AELTEREN Commit,
      # haengt die aus dem Dispatch-Ref gebaute APK am Release dieses alten Tags — APK und
      # :latest-Images stammen dann aus verschiedenen Staenden. `target_commitish` hilft
      # dagegen NICHT: die GitHub-API ignoriert das Feld, wenn der Git-Tag schon existiert —
      # und existieren MUSS er ja wegen Falle 1. Deshalb hier die SHAs vergleichen.
      - name: Release-Tag muss existieren und auf diesen Commit zeigen
        if: inputs.variant == 'prod'
        run: |
          v="${{ steps.ver.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "::error::Tag v$v fehlt. Erst 'git tag v$v && git push origin v$v' (baut die :latest-Images), dann diesen Workflow starten."
            exit 1
          fi
          # Annotated Tags: "^{}" liefert den Commit, auf den der Tag zeigt. Lightweight Tags
          # haben keinen peeled-Eintrag -> Fallback auf den Tag-Ref selbst.
          tag_sha=$(git ls-remote origin "refs/tags/v$v^{}" | cut -f1)
          if [ -z "$tag_sha" ]; then
            tag_sha=$(git ls-remote origin "refs/tags/v$v" | cut -f1)
          fi
          if [ "$tag_sha" != "${{ github.sha }}" ]; then
            echo "::error::Tag v$v zeigt auf $tag_sha, gebaut wird aber ${{ github.sha }} (${{ github.ref_name }}). Die APK wuerde am Release eines anderen Commits haengen. Workflow direkt auf dem Tag v$v starten (oder passend neu taggen)."
            exit 1
          fi
          echo "Tag v$v vorhanden und zeigt auf $tag_sha (= dieser Build)."

      - name: Select manifest variant
        id: manifest
        working-directory: twa
        run: |
          if [ "${{ inputs.variant }}" = "dev" ]; then
            echo "Using dev manifest (rookhub-dev.oberschmid.homes)"
            cp twa-manifest.dev.json twa-manifest.json
          else
            echo "Using prod manifest (rookhub.oberschmid.homes)"
          fi
          cat twa-manifest.json | head -20
          # Der sign-Job hat keinen Checkout; er bekommt den Schluessel-Alias von hier.
          echo "key_alias=$(jq -r '.signingKey.alias' twa-manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      # Android SDK bereitstellen + Lizenzen akzeptieren.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true

      # Genau die Stände, die Bubblewrap braucht: Build-Tools = BUILD_TOOLS_VERSION aus @bubblewrap/core
      # (1.25.0: 36.1.0), Plattform = compileSdkVersion der Vorlage (36). Fehlen die Build-Tools, installiert
      # Bubblewrap sie selbst — interaktiv, in der CI ohne TTY ein Abbruch.
      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      # Festgenagelt: eine neue Bubblewrap-Version zieht neue Build-Tools/Plattformen nach sich (s. oben).
      # Beim Anheben die Version in twa/bubblewrap/package.json, das Lockfile (`npm install
      # --package-lock-only --ignore-scripts`) und die Build-Tools-Zeilen hier und im sign-Job
      # gemeinsam ändern. `npm ci` installiert exakt den eingecheckten Baum (Integrity-Hashes),
      # `--ignore-scripts` laesst keine Install-Skripte laufen (heute hat keins der Pakete eins).
      - name: Install Bubblewrap CLI
        working-directory: twa/bubblewrap
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Pflicht: Bubblewrap erkennt JDK/SDK NICHT automatisch (auch nicht ueber
      # JAVA_HOME/ANDROID_HOME) und fragt sonst interaktiv "Do you want Bubblewrap
      # to install the JDK?" -> in der CI (kein TTY) bricht das mit Exit 130 ab.
      # Mit vorab geschriebener config.json nutzt es das vorhandene JDK + SDK.
      - name: Configure Bubblewrap (use preinstalled JDK + SDK)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          EOF
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Bubblewrap prüft, ob im SDK ein `tools/` oder `bin/` liegt (AndroidSdkTools.validatePath), und ruft
          # dort `bin/sdkmanager` auf. Das Runner-Image hat den alten `tools`-Ordner nicht mehr — am 27.09.2026
          # scheiterte der Build daran mit „The provided androidSdk isn't correct." (im Juni lief er noch). Also
          # auf die Kommandozeilen-Tools zeigen, die setup-android eben installiert hat (die auf dem PATH).
          if [ ! -e "$ANDROID_SDK_ROOT/tools" ] && [ ! -e "$ANDROID_SDK_ROOT/bin" ]; then
            cmdline="$(dirname "$(dirname "$(command -v sdkmanager)")")"
            ln -s "$cmdline" "$ANDROID_SDK_ROOT/tools"
            echo "tools -> $cmdline"
          fi
          ls "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

      - name: Generate Android project from manifest
        working-directory: twa
        run: bubblewrap update --skipVersionUpgrade

      # `--skipSigning`: Bubblewrap fragt keine Passwoerter ab und legt die Dateien UNSIGNIERT ab —
      # die APK als app-release-unsigned-aligned.apk (zipalign-geprueft), das AAB unter app/build/….
      - name: Build unsigned AAB + APK
        working-directory: twa
        run: |
          bubblewrap build --skipPwaValidation --skipSigning
          mkdir -p unsigned
          cp app-release-unsigned-aligned.apk unsigned/app-release-unsigned-aligned.apk
          cp app/build/outputs/bundle/release/app-release.aab unsigned/app-release-unsigned.aab

      - name: Upload unsigned AAB + APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rookhub-android-${{ inputs.variant }}-unsigned
          path: twa/unsigned/
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    # Nur lesen: hier liegt der Schluessel, also kein Schreibrecht und kein Checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rookhub-android-${{ inputs.variant }}-unsigned
          path: twa

      # apksigner aus dem vorinstallierten Android-SDK des Runners, dieselbe Build-Tools-Version,
      # mit der Bubblewrap 1.25.0 signiert hat (BUILD_TOOLS_VERSION) — gleiche Signaturschemata.
      - name: Provide apksigner (build-tools 36.1.0)
        run: |
          bt="$ANDROID_HOME/build-tools/36.1.0"
          if [ ! -x "$bt/apksigner" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.1.0" >/dev/null
          fi
          test -x "$bt/apksigner"
          echo "$bt" >> "$GITHUB_PATH"

      # Dieselben Aufrufe wie bisher in Bubblewrap (apksigner sign / jarsigner mit SHA256withRSA,
      # SHA-256), nur die Passwoerter aus der Umgebung (env:/:env) statt als Argument durch eine
      # Shell. Der Keystore liegt ausserhalb des Arbeitsbaums und ist nach dem Schritt weg.
      - name: Sign APK + AAB
        working-directory: twa
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ needs.build.outputs.key_alias }}
        run: |
          ks="$RUNNER_TEMP/android.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          apksigner sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out app-release-signed.apk app-release-unsigned-aligned.apk
          js="${JAVA_HOME:-}/bin/jarsigner"; [ -x "$js" ] || js=jarsigner
          "$js" -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$ks" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -signedjar app-release-bundle.aab app-release-unsigned.aab "$KEY_ALIAS"
          # Zertifikat ins Log: muss dem der installierten App entsprechen (sonst kein Update).
          apksigner verify --print-certs app-release-signed.apk

      - name: Upload AAB + APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rookhub-android-${{ inputs.variant }}
          path: |
            twa/app-release-bundle.aab
            twa/app-release-signed.apk
          # `error` statt `warn`: die beiden Dateien SIND das Produkt dieses Jobs. Vorher endete
          # ein dev-Build grün mit einem LEEREN Artefakt, wenn Bubblewrap seine Ausgabenamen
          # änderte oder das Signieren ohne Exit-Code≠0 scheiterte (die prod-Variante fängt das
          # erst im Release-Schritt ab, den es für dev nicht gibt) — auffallen würde das erst,
          # wenn jemand die APK installieren will.
          if-no-files-found: error

  # Nur prod: frische APK/AAB an ein GitHub-Release hängen + als "latest" markieren,
  # damit releases/latest/download/app-release-signed.apk immer die aktuelle App liefert.
  # Einziger Job mit Schreibrecht — und ohne Secrets, ohne Checkout, ohne npm.
  release:
    needs: [build, sign]
    if: inputs.variant == 'prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rookhub-android-${{ inputs.variant }}
          path: twa

      - name: Publish GitHub Release with fresh APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: RookHub ${{ needs.build.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            RookHub Android-App v${{ needs.build.outputs.version }}.

            - `app-release-signed.apk` — Direkt-Download für /install
            - `app-release-bundle.aab` — Play-Store-Bundle
          files: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
