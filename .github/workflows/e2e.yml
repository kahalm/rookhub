name: E2E (Playwright)

# Die komplette E2E-Suite (`e2e/puzzles`, `puzzle-moves`, `dashboard`, `viz-mobile`, `offline`)
# lief in KEINEM Workflow — sie deckt genau den Bereich ab, der laut CLAUDE.md am fragilsten ist
# (Service Worker + Offline-Pools + Engine-Prefetch), und wurde nur von Hand gestartet.
#
# BEWUSST kein Gate für Push/PR: der Lauf baut einen ganzen Stack (compose.e2e.yml) und braucht
# Minuten. Er ist per Hand startbar (Actions → „E2E (Playwright)" → Run workflow) und läuft
# zusätzlich nachts, damit ein Bruch am nächsten Morgen sichtbar ist statt erst beim Nutzer.
#
# Sichtbar heißt: ein roter NACHTLAUF meldet sich in Discord (Schritt am Ende, Secret
# DISCORD_CI_WEBHOOK). Ohne diesen Schritt war das E2E ab 4be56d1b (04.09.) neun Nächte rot,
# bis es am 13.09. jemand bemerkte — die Actions-Oberfläche allein hat keinen Empfänger.
on:
  workflow_dispatch:
  schedule:
    # 03:30 UTC. Geprüft wird der Stand von master AUS DEM QUELLBAUM: compose.e2e.yml baut api und
    # frontend selbst — die ghcr-Images, die Watchtower nachts zieht, sieht dieser Lauf NICHT.
    - cron: '30 3 * * *'

# Gemeinsame Form aller Workflows (Codereview I1-018, CiWorkflowTests haelt sie fest): Rechte NUR je
# Job — oben nichts, damit kein Job an der Repo-Vorgabe haengt (stellt die jemand auf „read and
# write", bekommt trotzdem keiner mehr); jede Action per Commit-SHA mit der Version als Kommentar,
# dieselbe Action in allen Dateien auf demselben SHA — beim Anheben alle Dateien gemeinsam aendern.
permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/app/package-lock.json
      - run: npm ci
        working-directory: src/frontend/app
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend/app
      # Startet den isolierten Stack, seedet, führt Playwright aus und räumt selbst auf.
      - run: bash scripts/e2e.sh
      - name: Playwright-Bericht sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: src/frontend/app/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      # Nur der Nachtlauf meldet sich — einen Handstart sieht, wer ihn gestartet hat. cancelled()
      # gehört dazu: ein hängender Lauf endet an timeout-minutes als ABGEBROCHEN, nicht als rot.
      - name: Roten Nachtlauf melden
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
        run: |
          bash .github/scripts/ci_alert.sh "RookHub: der nächtliche E2E-Lauf (Playwright) ist rot."
