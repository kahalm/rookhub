name: E2E (Playwright)

# Die komplette E2E-Suite (`e2e/puzzles`, `puzzle-moves`, `dashboard`, `viz-mobile`, `offline`)
# lief in KEINEM Workflow — sie deckt genau den Bereich ab, der laut CLAUDE.md am fragilsten ist
# (Service Worker + Offline-Pools + Engine-Prefetch), und wurde nur von Hand gestartet.
#
# BEWUSST kein Gate für Push/PR: der Lauf baut einen ganzen Stack (compose.e2e.yml) und braucht
# Minuten. Er ist per Hand startbar (Actions → „E2E (Playwright)" → Run workflow) und läuft
# zusätzlich nachts, damit ein Bruch am nächsten Morgen sichtbar ist statt erst beim Nutzer.
on:
  workflow_dispatch:
  schedule:
    # 03:30 UTC — nach dem Watchtower-Fenster (~02:00), damit die Nacht-Images mitgeprüft sind.
    - cron: '30 3 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/app/package-lock.json
      - run: npm ci
        working-directory: src/frontend/app
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend/app
      # Startet den isolierten Stack, seedet, führt Playwright aus und räumt selbst auf.
      - run: bash scripts/e2e.sh
      - name: Playwright-Bericht sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/frontend/app/playwright-report
          if-no-files-found: ignore
          retention-days: 7
