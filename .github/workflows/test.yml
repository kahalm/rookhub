name: Tests

on:
  workflow_call:
  pull_request:
    branches: [master]

jobs:
  test-rookhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # FALLE: Die Projekte targeten net10.0. Ein 9.0.x-Pin baut sie NICHT — dass es
      # trotzdem lief, lag nur am vorinstallierten SDK des Runner-Images. Beim naechsten
      # Framework-Bump muss diese Version hier mitwandern (Checkliste in TODO.md).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/RookHub.Api.Tests --verbosity normal

  # Zweite API-Suite gegen eine ECHTE MariaDB. Grund: test-rookhub laeuft gegen EF InMemory,
  # das jede LINQ-Abfrage im Speicher auswertet - auch eine, die MySQL nicht uebersetzen kann.
  # Solche Abfragen sind dort gruen und werfen erst in Produktion. Nachgestellt und belegt:
  # eine C#-Methode im Where liess die 2045 InMemory-Tests unberuehrt und faellt hier sofort.
  # Deckt ausserdem die 139 Migrationen ab, die der Deploy automatisch anwendet.
  test-rookhub-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # OHNE database= - jeder Test legt sein eigenes Wegwerf-Schema an und raeumt es weg.
      # Fehlt die Variable, ueberspringen sich die Tests (siehe MySqlFactAttribute), damit
      # `dotnet test` ohne Docker lokal gruen bleibt statt rot.
      - run: dotnet test tests/RookHub.Api.IntegrationTests --verbosity normal
        env:
          ROOKHUB_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=test"

  test-crawler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../chessresults_crawler
    steps:
      - uses: actions/checkout@v6
        with:
          path: rookhub
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/chessresults_crawler
          path: chessresults_crawler
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/ChessResultsCrawler.Tests --verbosity normal
        working-directory: chessresults_crawler

  # Engine-Provider (engine-provider/): das Docker-Setup für den Rechner des Nutzers. Seine drei
  # Tests liefen in KEINEM Workflow — wer patch_provider.py, entrypoint.sh oder PROVIDER_SHA
  # anfasste, hatte eine grüne CI und kein einziges ausgeführtes Regressionsnetz. Das Image bauen
  # wäre teuer (Stockfish-Download); stattdessen wird derselbe GEPINNTE Provider samt Prüfsumme
  # direkt geholt — die Werte kommen aus dem Dockerfile, damit sie nicht auseinanderlaufen.
  test-engine-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Gepinnten Provider holen (Prüfsumme wie im Dockerfile)
        working-directory: engine-provider
        run: |
          sha=$(grep -oP 'ARG PROVIDER_SHA=\K\S+' Dockerfile)
          sum=$(grep -oP 'ARG PROVIDER_SHA256=\K\S+' Dockerfile)
          test -n "$sha" && test -n "$sum"
          curl -fsSL "https://raw.githubusercontent.com/lichess-org/external-engine/$sha/example-provider.py" -o /tmp/provider.py
          echo "$sum  /tmp/provider.py" | sha256sum -c -
      - run: pip install --quiet requests
      # Argument-Aufbau + Vorprüfungen (Dry-Run) …
      - run: bash test/entrypoint.test.sh
        working-directory: engine-provider
      # … der ECHTE Fehlerpfad des Multi-Engine-Supervisors …
      - run: bash test/supervisor.test.sh
        working-directory: engine-provider
      # … und der eine Eingriff in den Provider (Lebenszeichen im Analyse-Stream).
      # Ein explizit übergebener, fehlender Pfad lässt den Test scheitern statt sich zu überspringen.
      - run: python3 test/heartbeat.test.py /tmp/provider.py
        working-directory: engine-provider

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/app/package-lock.json
      - run: npm ci
        working-directory: src/frontend/app
      # karma.conf sucht ohne CHROME_BIN eine Puppeteer-Cache-Shell, die es auf dem
      # Runner nicht gibt. Leerer Wert ist unschaedlich (karma faellt auf sein eigenes
      # Chrome-Lookup zurueck).
      - name: Chrome fuer Karma ermitteln
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)" >> "$GITHUB_ENV"
      # Der Build faengt nur Compile-Fehler — ohne diesen Schritt liefe kein einziger
      # Frontend-Spec im Gate, das die Image-Pushes freigibt.
      # BEIDE Projekte NAMENTLICH, aus zwei Gruenden: der Karma-Builder sammelt Specs je PROJEKT
      # ein (nach dem Umzug nach src-turnier liefen deren 17 Spec-Dateien = 81 Tests gar nicht
      # mehr mit, ohne dass etwas rot wurde), und sobald es zwei Test-Targets gibt, waehlt
      # `ng test` OHNE Projektnamen nicht mehr verlaesslich das Hauptprojekt — gemessen lief dann
      # nur noch die kleine App (81 statt 1911 Tests), wieder lautlos.
      - run: npx ng test app --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: src/frontend/app
      - run: npx ng test turnier --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: src/frontend/app
      # Seit der Turnier-Trennung hat der Workspace ZWEI Projekte — ohne Projektnamen bricht
      # `ng build` mit „Cannot determine project for command" ab. Beide bauen: das Gate soll
      # jedes der beiden Images abfangen, bevor es gepusht wird.
      - run: npx ng build app --configuration=production
        working-directory: src/frontend/app
      - run: npx ng build turnier --configuration=production
        working-directory: src/frontend/app
