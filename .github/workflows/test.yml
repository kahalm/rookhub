name: Tests

on:
  workflow_call:
  pull_request:
    branches: [master]

# Gemeinsame Form aller Workflows (Codereview I1-018, CiWorkflowTests haelt sie fest): Rechte NUR je
# Job — oben nichts, damit kein Job an der Repo-Vorgabe haengt (stellt die jemand auf „read and
# write", bekommt trotzdem keiner mehr); jede Action per Commit-SHA mit der Version als Kommentar,
# dieselbe Action in allen Dateien auf demselben SHA — beim Anheben alle Dateien gemeinsam aendern.
permissions: {}

jobs:
  # Welche Bereiche hat dieser Push angefasst? Die Muster stehen in `.github/filters.yml` —
  # dieselbe Datei benutzt `docker.yml` fuer die Image-Builds.
  #
  # Bei einem TAG-Lauf (nur `vX.Y.Z` auf master, siehe docker.yml) gibt es keinen sinnvollen
  # Vorgaenger-Stand zum Vergleichen, und ein Release muss ohnehin vollstaendig gebaut und
  # geprueft werden: dort laeuft alles, ungefiltert.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      turnier: ${{ steps.filter.outputs.turnier }}
      kidhub: ${{ steps.filter.outputs.kidhub }}
      leaguehub: ${{ steps.filter.outputs.leaguehub }}
      clubhub: ${{ steps.filter.outputs.clubhub }}
      crawler: ${{ steps.filter.outputs.crawler }}
      engine-provider: ${{ steps.filter.outputs.engine-provider }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Beim Handstart von `docker.yml` (workflow_dispatch) gibt es keinen Vorgaenger-Stand zum
      # Vergleichen; der Schritt bleibt aus, und die Bedingungen unten lassen dann ALLES laufen.
      # Ohne das waeren bei einem Handstart alle Filter leer — es entstuende ein Image, das kein
      # einziger Test gesehen hat.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: .github/filters.yml

  test-rookhub:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Zwei Haelften auf zwei Runnern statt einer Suite auf einem (lag bei 4–5 min auf dem kritischen
    # Pfad): xUnit fuehrt die Tests EINER Klasse nacheinander aus, und die Scoresheet- und Auth-Klassen
    # brauchen allein je 30–70 s — zusammen mit dem Rest teilten sie sich vier Kerne. `rest` ist die
    # exakte Verneinung von `scoresheet-accounts`, damit kein Test zwischen die Haelften faellt
    # (CiWorkflowTests haelt das fest). fail-fast aus: eine rote Haelfte soll die andere zu Ende laufen lassen.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: scoresheet-accounts
            filter: "FullyQualifiedName~RookHub.Api.Tests.Scoresheet.|FullyQualifiedName~RookHub.Api.Tests.Accounts."
          - shard: rest
            filter: "FullyQualifiedName!~RookHub.Api.Tests.Scoresheet.&FullyQualifiedName!~RookHub.Api.Tests.Accounts."
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # FALLE: Die Projekte targeten net10.0. Ein 9.0-Kanal baut sie NICHT — dass es
      # trotzdem lief, lag nur am vorinstallierten SDK des Runner-Images. Beim naechsten
      # Framework-Bump muss der Kanal hier (und in audit.yml) mitwandern (Checkliste in TODO.md).
      # Seit 0.838.1 die eigene Aktion statt actions/setup-dotnet: dessen aka.ms-Download antwortet 409
      # (Begruendung in .github/actions/dotnet-sdk/action.yml).
      - uses: ./.github/actions/dotnet-sdk
        with:
          channel: '10.0'
      - run: dotnet test tests/RookHub.Api.Tests --filter "${{ matrix.filter }}" --verbosity normal
      # Die Wartungswerkzeuge unter tools/ referenzieren die API, gehen aber in kein Image und in keinen Test —
      # ohne diesen Schritt fiel eine API-Aenderung, die sie bricht, erst beim naechsten Lauf von Hand auf
      # (Codereview A6-011). Nur in einer Haelfte: die API ist dort schon gebaut, der Schritt kostet Sekunden.
      # CiWorkflowTests haelt fest, dass jedes tools/<Name>/<Name>.csproj hier gebaut wird.
      - run: dotnet build tools/LibraryImport --verbosity minimal
        if: matrix.shard == 'rest'
      - run: dotnet build tools/ScoresheetBench --verbosity minimal
        if: matrix.shard == 'rest'

  # Zweite API-Suite gegen eine ECHTE MariaDB. Grund: test-rookhub laeuft gegen EF InMemory,
  # das jede LINQ-Abfrage im Speicher auswertet - auch eine, die MySQL nicht uebersetzen kann.
  # Solche Abfragen sind dort gruen und werfen erst in Produktion. Nachgestellt und belegt:
  # eine C#-Methode im Where liess die 2045 InMemory-Tests unberuehrt und faellt hier sofort.
  # Deckt ausserdem die 139 Migrationen ab, die der Deploy automatisch anwendet.
  test-rookhub-integration:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        # Der erste Health-Check laeuft erst NACH einem vollen Intervall — mit 10 s stand der Job
        # also zehn Sekunden vor einer laengst bereiten Datenbank. 5 s halbiert das; die Toleranz
        # insgesamt bleibt gleich (5 s x 20 = 100 s wie vorher 10 s x 10), und `health-start-period`
        # sorgt dafuer, dass die unvermeidlichen Fehlschlaege waehrend des Hochfahrens nicht auf
        # die Versuche angerechnet werden. Gemessen: „Initialize containers" 24 s (2026-09-20).
        #
        # `--tmpfs`: Datenverzeichnis im RAM. Jede Fixture legt ein frisches Schema an und spielt
        # ALLE Migrationen ein — das sind tausende DDL-Befehle, und InnoDB fsynct bei jedem. Auf der
        # Runner-Platte war das der Grossteil der Laufzeit; der Container ist ohnehin Wegwerf.
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=5s
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/dotnet-sdk
        with:
          channel: '10.0'
      # OHNE database= - jeder Test legt sein eigenes Wegwerf-Schema an und raeumt es weg.
      # Fehlt die Variable, ueberspringen sich die Tests (siehe MySqlFactAttribute), damit
      # `dotnet test` ohne Docker lokal gruen bleibt statt rot.
      - run: dotnet test tests/RookHub.Api.IntegrationTests --verbosity normal
        env:
          ROOKHUB_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=test"

  # Vertrag mit dem Crawler (Codereview I2-010). Hier lief frueher die EIGENE Test-Suite des
  # Crawlers, und zwar gegen dessen main-HEAD: ein roter Crawler-Commit hielt damit jedes
  # rookhub-Image an (dieser Workflow ist das Gate in docker.yml), waehrend ein echter Vertragsbruch
  # gruen blieb — kein rookhub-Code wurde gegen den Crawler geprueft, und geprueft wurde nicht
  # einmal der Stand, der laeuft (das Crawler-Image entsteht aus SEINEM Tag; seine eigene CI testet
  # vor jedem Image ohnehin). Jetzt: der zuletzt GETAGGTE Crawler, und daran die goldenen
  # Antworten aus CrawlerContractTests — rot nur, wenn ein Feld fehlt, das RookHub liest bzw.
  # festhaelt; ein neues Crawler-Feld bricht nichts.
  test-crawler-contract:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.crawler == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Volle Historie, damit die Tags mitkommen.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/chessresults_crawler
          path: _crawler
          fetch-depth: 0
      - name: Crawler auf seinen letzten Release-Tag stellen
        working-directory: _crawler
        run: |
          tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ]; then
            echo "::error::Kein Release-Tag vX.Y.Z im Crawler-Repo — gegen welchen Stand soll der Vertrag gelten?"
            exit 1
          fi
          git checkout --quiet "$tag"
          echo "Vertrag gegen chessresults_crawler $tag"
      - uses: ./.github/actions/dotnet-sdk
        with:
          channel: '10.0'
      # CRAWLER_REPO gesetzt = der Abgleich gegen die Crawler-DTOs ueberspringt sich NICHT
      # (CrawlerSourceTheoryAttribute) — ein falscher Pfad waere sonst ein stilles Gruen.
      - run: dotnet test tests/RookHub.Api.Tests --filter "FullyQualifiedName~CrawlerContractTests" --verbosity normal
        env:
          CRAWLER_REPO: ${{ github.workspace }}/_crawler

  # Engine-Provider (engine-provider/): das Docker-Setup für den Rechner des Nutzers. Seine drei
  # Tests liefen in KEINEM Workflow — wer entrypoint.sh oder PROVIDER_SHA anfasste, hatte eine
  # grüne CI und kein einziges ausgeführtes Regressionsnetz. Das Image bauen
  # wäre teuer (Stockfish-Download); stattdessen wird derselbe GEPINNTE Provider samt Prüfsumme
  # direkt geholt — die Werte kommen aus dem Dockerfile, damit sie nicht auseinanderlaufen.
  test-engine-provider:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.engine-provider == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Gepinnten Provider holen (Prüfsumme wie im Dockerfile)
        working-directory: engine-provider
        run: |
          sha=$(grep -oP 'ARG PROVIDER_SHA=\K\S+' Dockerfile)
          sum=$(grep -oP 'ARG PROVIDER_SHA256=\K\S+' Dockerfile)
          test -n "$sha" && test -n "$sum"
          curl -fsSL "https://raw.githubusercontent.com/lichess-org/external-engine/$sha/example-provider.py" -o /tmp/provider.py
          echo "$sum  /tmp/provider.py" | sha256sum -c -
      # Dieselbe aiohttp-Fassung wie im Image (requirements.txt) — Provider UND Test-Broker brauchen sie.
      - name: aiohttp wie im Image
        working-directory: engine-provider
        run: pip install --quiet -r requirements.txt
      # Derselbe Eingriff wie im Dockerfile (frische Verbindung je Upload, upstream Issue #45) — der
      # Vertragstest unten prüft ihn mit und ist ungepatcht rot.
      - run: python3 patch_force_close.py /tmp/provider.py
        working-directory: engine-provider
      # Argument-Aufbau + Vorprüfungen (Dry-Run) …
      - run: bash test/entrypoint.test.sh
        working-directory: engine-provider
      # … die Token-Vorabprüfung gegen einen nachgebauten /api/token/test (RookHub- und Lichess-Form) …
      - run: python3 test/preflight.test.py
        working-directory: engine-provider
      # … der ECHTE Fehlerpfad des Multi-Engine-Supervisors …
      - run: bash test/supervisor.test.sh
        working-directory: engine-provider
      # … der Zeitplan: Regel-Auswertung ohne Prozesse und die Aufsicht mit Stub-Providern …
      - run: bash test/schedule.test.sh
        working-directory: engine-provider
      # … und der Vertrag, auf den RookHub beim gepinnten Provider baut: bestmove am Ende jeder Suche,
      # Lebenszeichen, kein Warten nach einer beendeten Suche — gegen einen nachgebauten Broker (~20 s).
      # Ein fehlender Pfad lässt den Test scheitern statt sich zu überspringen.
      - run: python3 test/provider.test.py /tmp/provider.py
        working-directory: engine-provider

  # Die Tests der Betriebs-Skripte (scripts/tests/, Codereview I1-015). Sie liefen in KEINEM
  # Workflow — die C#-Tests oben pruefen nur Zeichenketten in den Skripten. Bricht eine Aenderung
  # an backup-db.sh das Quoting der defaults-extra-Datei oder gibt das Passwort wieder als Argument
  # weiter, zeigt test_backup_db.sh (Fake-docker) das sofort; die CI war trotzdem gruen. Alle laufen
  # ohne Container und Netz (Fake-docker/-curl/-urlopen), zusammen in wenigen Sekunden.
  # CiWorkflowTests haelt fest, dass JEDE Datei aus scripts/tests/ hier aufgerufen wird.
  test-scripts:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    # Die fuenf Tests brauchen zusammen Sekunden. Ohne Deckel liefe ein kuenftig kaputter
    # MAX_ROUNDS-Deckel in directory-runs.sh bis zum 6-h-Standard und hielte so lange das
    # Image-Gate (docker.yml tests:) an.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: bash scripts/tests/test_backup_db.sh
      - run: bash scripts/tests/test_directory_runs.sh
      - run: bash scripts/tests/test_init_db.sh
      - run: python3 scripts/tests/test_es_log_retention.py
      - run: python3 scripts/tests/test_prep_import.py
      - run: bash scripts/tests/test_release_notes.sh

  build-frontend:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.frontend == 'true'
          || needs.changes.outputs.turnier == 'true'
          || needs.changes.outputs.kidhub == 'true'
          || needs.changes.outputs.leaguehub == 'true'
          || needs.changes.outputs.clubhub == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/app/package-lock.json
      - run: npm ci
        working-directory: src/frontend/app
      # Linter (Codereview F8-004), PHASE 2 = RATSCHE: eslint.config.mjs laesst jede Regel auf 'warn',
      # eslint-baseline.json haelt je Regel die erlaubte Anzahl. Liegt eine Regel darueber, wird der
      # Job ROT (bewusst KEIN continue-on-error) — die Ausgabe nennt Regel, Baseline → jetzt und die
      # Dateien mit Treffern. Abhilfe: Stelle fixen, nicht die Baseline heben (docs/ci.md). Sinkende
      # Zahlen bleiben gruen; `npm run lint:ratchet:update` senkt die Baseline. Die Tabelle
      # (Regel | Baseline | jetzt | Δ) geht in die Job-Summary. Phase 3: Regeln mit Baseline 0 auf 'error'.
      - name: ESLint-Ratschen-Logik (node --test)
        working-directory: src/frontend/app
        run: node --test scripts/eslint-ratchet.test.mjs
      - name: ESLint-Ratsche (keine Regel ueber eslint-baseline.json)
        working-directory: src/frontend/app
        run: node scripts/eslint-ratchet.mjs --summary "$GITHUB_STEP_SUMMARY"
      # stylelint-Ratsche (Codereview F8-003, fest verdrahtete Farbwerte): dasselbe Muster wie die ESLint-Ratsche.
      # stylelint.config.mjs zaehlt Hex-Farben (color-no-hex) und Text-/Hintergrundfarben als Hex ohne Token
      # (declaration-property-value-disallowed-list) in *.scss und den Inline-Styles der Komponenten;
      # stylelint-baseline.json haelt den Bestand. Mehr als dort → Job ROT (bewusst nicht abschaltbar): Token aus
      # src/_tokens.scss nehmen, nicht die Baseline heben. Abbau: `npm run lint:css:ratchet:update`.
      - name: stylelint-Ratschen-Logik (node --test)
        working-directory: src/frontend/app
        run: node --test scripts/stylelint-ratchet.test.mjs
      - name: stylelint-Ratsche (keine Regel ueber stylelint-baseline.json)
        working-directory: src/frontend/app
        run: node scripts/stylelint-ratchet.mjs --summary "$GITHUB_STEP_SUMMARY"
      # Changelog als DATEN (Codereview F8-008): changelog-data.ts bleibt die Quelle, der Build liefert es aber als
      # /assets/changelog.json (lazy-Gruppe `changelog` im Service Worker) statt als ~2 MB-Chunk in der prefetch-Gruppe.
      # Wie im Dockerfile vor `ng build app` erzeugen, damit dieses Gate dasselbe Bundle baut wie das Image.
      - name: Changelog als Daten (node --test + JSON erzeugen)
        working-directory: src/frontend/app
        run: |
          node --test scripts/changelog-json.test.mjs
          node scripts/changelog-json.mjs
      # karma.conf sucht ohne CHROME_BIN eine Puppeteer-Cache-Shell, die es auf dem
      # Runner nicht gibt. Leerer Wert ist unschaedlich (karma faellt auf sein eigenes
      # Chrome-Lookup zurueck).
      - name: Chrome fuer Karma ermitteln
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)" >> "$GITHUB_ENV"
      # Der Build faengt nur Compile-Fehler — ohne diesen Schritt liefe kein einziger
      # Frontend-Spec im Gate, das die Image-Pushes freigibt.
      # JEDES Projekt NAMENTLICH (die vier Hubs in `build-frontend-hubs`; CiWorkflowTests haelt fest,
      # dass jedes Projekt aus angular.json irgendwo getestet und gebaut wird), aus zwei Gruenden: der Karma-Builder sammelt Specs je PROJEKT
      # ein (nach dem Umzug nach src-turnier liefen deren 17 Spec-Dateien = 81 Tests gar nicht
      # mehr mit, ohne dass etwas rot wurde), und sobald es zwei Test-Targets gibt, waehlt
      # `ng test` OHNE Projektnamen nicht mehr verlaesslich das Hauptprojekt — gemessen lief dann
      # nur noch die kleine App (81 statt 1911 Tests), wieder lautlos.
      - run: npx ng test app --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: src/frontend/app
      # Seit der Turnier-Trennung hat der Workspace ZWEI Projekte — ohne Projektnamen bricht
      # `ng build` mit „Cannot determine project for command" ab. Alle bauen: das Gate soll
      # jedes Image abfangen, bevor es gepusht wird.
      - run: npx ng build app --configuration=production
        working-directory: src/frontend/app
      # Das Changelog liegt als Asset im Bundle und im Service Worker in einer lazy-Gruppe — nie wieder in `app` (prefetch).
      - name: Changelog-JSON im Bundle, lazy im Service Worker
        working-directory: src/frontend/app
        run: |
          test -s dist/app/browser/assets/changelog.json
          node -e "const n=require('./dist/app/browser/ngsw.json'); const g=n.assetGroups.filter(g=>g.urls.includes('/assets/changelog.json')); if(g.length!==1||g[0].installMode!=='lazy'||g[0].updateMode!=='lazy'){console.error('changelog.json nicht (nur) in einer lazy-Gruppe:',g.map(x=>x.name));process.exit(1)}"

  # Die vier kleinen Oberflaechen in einem EIGENEN Job neben `build-frontend` (nur RookHub selbst
  # + Linter): nacheinander in einem Job lagen alle fuenf Projekte bei 4–5,5 min und damit auf dem
  # kritischen Pfad vor den Image-Pushes. Dieselbe Bedingung wie dort — die Hubs teilen ueber den
  # @rh/*-Alias den Code des Hauptprojekts, eine Aenderung an einem trifft potenziell alle.
  build-frontend-hubs:
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.frontend == 'true'
          || needs.changes.outputs.turnier == 'true'
          || needs.changes.outputs.kidhub == 'true'
          || needs.changes.outputs.leaguehub == 'true'
          || needs.changes.outputs.clubhub == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/app/package-lock.json
      - run: npm ci
        working-directory: src/frontend/app
      # karma.conf sucht ohne CHROME_BIN eine Puppeteer-Cache-Shell, die es auf dem
      # Runner nicht gibt. Leerer Wert ist unschaedlich (karma faellt auf sein eigenes
      # Chrome-Lookup zurueck).
      - name: Chrome fuer Karma ermitteln
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)" >> "$GITHUB_ENV"
      - run: npx ng test turnier --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: src/frontend/app
      - run: npx ng test kidhub --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: src/frontend/app
      - run: npx ng test leaguehub --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: src/frontend/app
      - run: npx ng test clubhub --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: src/frontend/app
      - run: npx ng build turnier --configuration=production
        working-directory: src/frontend/app
      - run: npx ng build kidhub --configuration=production
        working-directory: src/frontend/app
      - run: npx ng build leaguehub --configuration=production
        working-directory: src/frontend/app
      - run: npx ng build clubhub --configuration=production
        working-directory: src/frontend/app
