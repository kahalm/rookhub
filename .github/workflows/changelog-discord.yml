name: Changelog → Discord

# Postet neue Changelog-Einträge (changelog-data.ts, deutscher Text) in den Discord-
# Changelog-Channel — als silent messages, ohne Push-Benachrichtigungen. Erfasst nur,
# was hier eingetragen wird: RookHub selbst und die Satelliten-Änderungen, die per
# Hausregel mitgeführt werden (v. a. Crawler). Repos mit eigener Versionierung
# (RepCheck, piratechess, log-watcher) stehen nur drin, wenn jemand sie nachträgt.
# workflow_dispatch postet den neuesten Eintrag (manueller Test/Nachreichen).

on:
  push:
    branches: [master]
    paths:
      # Die EINTRÄGE stehen in changelog-data.ts (Split seit v0.355.0); changelog.ts bleibt in der
      # Liste, damit ein reiner Versions-Bump ohne Eintrag ebenfalls einen Lauf auslöst.
      - src/frontend/app/src/environments/changelog-data.ts
      - src/frontend/app/src/environments/changelog.ts
  workflow_dispatch:
    inputs:
      since_version:
        description: 'Backfill: alle Einträge ab dieser Version bis zum neuesten posten (leer = nur neuester)'
        required: false
        default: ''

# Gemeinsame Form aller Workflows (Codereview I1-018, CiWorkflowTests haelt sie fest): Rechte NUR je
# Job — oben nichts, damit kein Job an der Repo-Vorgabe haengt (stellt die jemand auf „read and
# write", bekommt trotzdem keiner mehr); jede Action per Commit-SHA mit der Version als Kommentar,
# dieselbe Action in allen Dateien auf demselben SHA — beim Anheben alle Dateien gemeinsam aendern.
permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Neue Changelog-Einträge posten
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO_LABEL: RookHub
          SINCE_VERSION: ${{ github.event.inputs.since_version }}
        run: python3 .github/scripts/changelog_discord.py
